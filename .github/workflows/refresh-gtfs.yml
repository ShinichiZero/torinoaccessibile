name: Refresh GTFS stops

on:
  schedule:
    - cron: '15 7 * * 1'
  workflow_dispatch:

concurrency:
  group: gtfs-refresh
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run refresh:gtfs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: refreshed-gtfs
          path: public/data/gtt-stops.json
          if-no-files-found: error
          retention-days: 1

  publish-review-pr:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: refreshed-gtfs
          path: ${{ runner.temp }}/refreshed-gtfs
      - name: Update the dedicated bot branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          refreshed_file="$RUNNER_TEMP/refreshed-gtfs/gtt-stops.json"
          test -s "$refreshed_file"
          cp "$refreshed_file" public/data/gtt-stops.json

          if git diff --quiet -- public/data/gtt-stops.json; then
            echo 'GTFS dataset is unchanged.'
            exit 0
          fi

          if git ls-remote --exit-code --heads origin automation/gtfs-refresh >/dev/null; then
            git fetch --no-tags origin automation/gtfs-refresh
            git checkout -B automation/gtfs-refresh FETCH_HEAD
          else
            git checkout -b automation/gtfs-refresh
          fi

          cp "$refreshed_file" public/data/gtt-stops.json
          git add public/data/gtt-stops.json
          if git diff --cached --quiet; then
            echo 'Bot branch already contains this GTFS dataset.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh GTT GTFS stops'
          gh auth setup-git
          git push origin automation/gtfs-refresh

          pr_number=$(gh pr list --state open --head automation/gtfs-refresh --json number --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head automation/gtfs-refresh \
              --title 'chore: refresh GTT GTFS stops' \
              --body 'Weekly refresh of the published GTT GTFS stop dataset. Review the generated changes and freshness metadata before merging.'
          fi
